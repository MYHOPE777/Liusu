<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>千川流速 · 定位直播间</title>
  <style>
    :root { color-scheme: light; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17323a; background: #f3f7f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(680px, 100%); background: #fff; border: 1px solid #d7e2e3; border-radius: 8px; box-shadow: 0 12px 32px #17323a1a; padding: 28px; }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: 0; }
    p { margin: 0 0 20px; color: #63767d; }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .input-row { display: flex; gap: 8px; }
    input { min-width: 0; flex: 1; border: 1px solid #c7d6d8; border-radius: 5px; padding: 11px 12px; color: inherit; font: inherit; }
    input:focus { outline: 2px solid #8bd1c2; outline-offset: 1px; border-color: #55a895; }
    button, a { border: 1px solid #247c6c; border-radius: 5px; background: #247c6c; color: #fff; padding: 10px 14px; font: inherit; text-decoration: none; cursor: pointer; white-space: nowrap; }
    button:hover, a:hover { background: #1d675a; }
    .status { min-height: 22px; margin-top: 12px; color: #b14c42; }
    .status[data-state="success"] { color: #247c6c; }
    .open-link { display: inline-block; margin-top: 4px; }
    .steps { margin: 24px 0 0; padding-top: 18px; border-top: 1px solid #edf1f2; color: #63767d; font-size: 13px; }
    .steps strong { color: #334e55; }
    @media (max-width: 560px) { main { padding: 20px; } .input-row { display: grid; } button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <h1>定位千川主播大屏</h1>
    <p>粘贴已登录账号可访问的主播大屏 URL，打开对应直播间。</p>
    <form data-live-url-form>
      <label for="live-url">主播大屏 URL</label>
      <div class="input-row">
        <input id="live-url" data-live-url-input type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://compass.jinritemai.com/screen/anchor/talent?..." required>
        <button type="submit">定位直播间</button>
      </div>
      <div class="status" data-live-url-status role="status" aria-live="polite"></div>
      <a class="open-link" data-live-url-open hidden target="_blank" rel="noopener noreferrer"></a>
    </form>
    <div class="steps"><strong>打开后：</strong>在目标页面运行 <code>standalone/overlay-runner.js</code>，或点击已保存的 bookmarklet，右上角即可显示流速。</div>
  </main>
  <script src="launcher.js"></script>
</body>
</html>
